name: Validate Version

on:
  workflow_call:

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
    - name: 🗃️ Checkout
      uses: actions/checkout@v4

    - name: ⛏️ Extract version from csproj
      id: csproj
      shell: pwsh
      run: |
        $version = .github/workflows/scripts/Get-Version.ps1 -Path "src"

        Write-Output $version
        Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: 🟰 Compare tag with csproj version
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME

        # Strip leading 'v'
        $cleanTag = $tag.TrimStart('v')

        $csprojVersion = "${{ steps.csproj.outputs.version }}"

        if ($cleanTag -ne $csprojVersion) {
            Write-Output "Version mismatch:"
            Write-Output "  Tag:      $tag"
            Write-Output "  CleanTag: $cleanTag"
            Write-Output "  csproj:   $csprojVersion"
            exit 1
        }

        